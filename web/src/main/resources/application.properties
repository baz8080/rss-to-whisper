# Path to the SQLite database produced by index.py
app.db.path=${APP_DB_PATH:/podcasts.db}

# HTTP URL of the pipeline's data directory: audio and words.jsonl.gz are read from under it.
# Must be absolute (http/https) for word timings to work.
app.data.url=${APP_DATA_URL:/audio}

# Thymeleaf template caching — disabled in dev so live-reload picks up edits
# without a full restart. Quarkus sets the active profile to "dev" automatically
# when running quarkusDev, so this override is applied automatically.
%dev.app.templates.cache=false
app.templates.cache=true

# HTTP port
quarkus.http.port=8080

# Logging
quarkus.log.level=WARN
quarkus.log.category."com.rsstowhisper".level=INFO
