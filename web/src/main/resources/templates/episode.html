<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${episode.episodeTitle != null ? episode.episodeTitle : 'Episode'}">Episode</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css"/>
    <link rel="stylesheet" href="/styles.css"/>
    <script src="/htmx.min.js"></script>
</head>
<body>

<div class="episode-detail">

    <a href="javascript:history.back()" class="back-link">&#x2190; Back to results</a>

    <div class="podcast-name"
         th:text="${episode.podcastTitle != null ? episode.podcastTitle : 'Unknown Podcast'}"></div>
    <h2 th:text="${episode.episodeTitle != null ? episode.episodeTitle : 'Untitled'}"></h2>

    <table class="episode-meta-table">
        <tbody>
        <tr th:if="${episode.episodePublishedOn != null}">
            <th>Published</th>
            <td th:text="${episode.episodePublishedOn}"></td>
        </tr>
        <tr th:if="${episode.formattedDuration != null}">
            <th>Duration</th>
            <td th:text="${episode.formattedDuration}"></td>
        </tr>
        <!-- Season + episode number together when both present -->
        <tr th:if="${episode.episodeSeason != null and episode.episodeNumber != null}">
            <th>Season / Episode</th>
            <td th:text="'S' + ${episode.episodeSeason} + 'E' + ${episode.episodeNumber}"></td>
        </tr>
        <!-- Season alone -->
        <tr th:if="${episode.episodeSeason != null and episode.episodeNumber == null}">
            <th>Season</th>
            <td th:text="${episode.episodeSeason}"></td>
        </tr>
        <!-- Episode number alone -->
        <tr th:if="${episode.episodeSeason == null and episode.episodeNumber != null}">
            <th>Episode</th>
            <td th:text="${episode.episodeNumber}"></td>
        </tr>
        <tr th:if="${episode.episodeType != null and episode.episodeType != 'full'}">
            <th>Type</th>
            <td th:text="${episode.episodeType}"></td>
        </tr>
        <tr th:if="${episode.podcastCollections != null and not #strings.isEmpty(episode.podcastCollections)}">
            <th>Collections</th>
            <td th:text="${episode.podcastCollections}"></td>
        </tr>
        <tr th:if="${not episode.tagList.isEmpty()}">
            <th>Tags</th>
            <td>
                <a class="tag-pill"
                   th:each="tag : ${episode.tagList}"
                   th:href="'/search?tag=' + ${#uris.escapeQueryParam(tag)}"
                   th:text="${tag}"></a>
            </td>
        </tr>
        <!-- linkifiedSummary is pre-processed in SearchResource: URLs wrapped in <a> tags -->
        <tr th:if="${linkifiedSummary != null and not #strings.isEmpty(linkifiedSummary)}">
            <th>Summary</th>
            <td th:utext="${linkifiedSummary}"></td>
        </tr>
        <tr th:if="${episode.episodeWebLink != null}">
            <th>Episode page</th>
            <td>
                <a th:href="${episode.episodeWebLink}"
                   th:text="${episode.episodeWebLink}"
                   target="_blank"></a>
            </td>
        </tr>
        <tr th:if="${episode.episodeAudioLink != null}">
            <th>Original audio</th>
            <td><a th:href="${episode.episodeAudioLink}" target="_blank">Link</a></td>
        </tr>
        </tbody>
    </table>

    <!-- Sticky: the audio player and, when the page was reached from a search, the match navigator -->
    <div class="playback-header" th:if="${episode.audioPath != null or not #strings.isEmpty(query)}">
        <div class="audio-player" th:if="${episode.audioPath != null}">
            <audio id="episode-audio"
                   controls="controls"
                   preload="none"
                   th:src="${audioBaseUrl + '/' + episode.audioPath}">
                <track id="episode-track" kind="captions" srclang="en" label="English" default="default"/>
                Your browser does not support audio.
            </audio>
        </div>

        <!-- Match navigator: the lines the search query matched, with previous/next -->
        <div class="match-nav" id="match-nav" th:if="${not #strings.isEmpty(query)}">
            <span class="match-summary">
                <th:block th:if="${matchCount > 0}">
                    <span id="match-position">1</span> of <span th:text="${matchCount}"></span>
                    <span th:text="${matchCount == 1 ? 'match' : 'matches'}"></span>
                </th:block>
                <th:block th:if="${matchCount == 0}">No matches in the transcript</th:block>
                for &#x201C;<span th:text="${query}"></span>&#x201D;
            </span>
            <span class="match-buttons" th:if="${matchCount > 1}">
                <button type="button" onclick="gotoMatch(currentMatch - 1)" title="Previous match (p)">&#x2191; Prev</button>
                <button type="button" onclick="gotoMatch(currentMatch + 1)" title="Next match (n)">&#x2193; Next</button>
            </span>
            <a th:href="'/episode/' + ${episode.id}" class="match-clear" title="Show the transcript without highlights">Clear</a>
        </div>
    </div>

    <!-- Transcript — parsed into timestamped lines by SearchResource -->
    <div th:if="${not transcriptLines.isEmpty()}">
        <div class="transcript-header">
            <h3>Transcript</h3>
            <!--/* Hidden until the sidecar is known to exist: episodes
                   transcribed before word timings were emitted have none. */-->
            <div class="word-controls" id="word-controls" hidden="hidden">
                <label title="Fade the words whisper was least sure of">
                    <input type="checkbox" id="dim-toggle"/>
                    <small>Mark low confidence</small>
                </label>
            </div>
        </div>
        <div class="transcript" id="transcript">
            <div class="transcript-line"
                 th:each="line : ${transcriptLines}"
                 th:classappend="${line.matched} ? 'match'"
                 th:data-start-ms="${line.millis}"
                 th:data-cue="${line.cueIndex}">
                <span class="transcript-time"
                      th:onclick="'seekAudio(' + ${line.seconds} + ')'"
                      th:title="'Play from ' + ${line.display} + ' and link to it'"
                      th:text="${line.display}"></span>
                <!--/* highlightedHtml is escaped by highlightMatches; only its <mark> tags are markup */-->
                <span class="transcript-text" th:if="${line.matched}" th:utext="${line.highlightedHtml}"></span>
                <span class="transcript-text" th:unless="${line.matched}" th:text="${line.text}"></span>
            </div>
        </div>
    </div>

    <!-- Fallback: raw transcript when it exists but couldn't be parsed -->
    <div th:if="${transcriptLines.isEmpty() and episode.transcript != null}">
        <h3>Transcript</h3>
        <div class="transcript">
            <p th:text="${episode.transcript}"></p>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const vttText = [[${episode.transcript}]];
        const audioEl = document.getElementById('episode-audio');
        const trackEl = document.getElementById('episode-track');

        // Wire the VTT content to the <track> via a blob URL — no extra endpoint needed.
        if (vttText && trackEl) {
            const blob = new Blob([vttText], {type: 'text/vtt'});
            trackEl.src = URL.createObjectURL(blob);
        }

        // The address bar always holds the last cue clicked, so a passage can be
        // copied out of it. replaceState rather than pushState: stepping through
        // a transcript should not fill the back button with its own cues.
        function rememberPosition(seconds) {
            history.replaceState(null, '', location.pathname + location.search + '#t=' + Math.floor(seconds));
        }

        const audioSrcBase = audioEl ? audioEl.src.split('#')[0] : null;

        // The player is preload="none", so before metadata arrives currentTime
        // does not stick -- browsers differ on whether it is remembered, clamped
        // or dropped. A media fragment is honoured natively by all of them and
        // survives the load, with a one-shot listener as the fallback for any
        // that ignore it.
        function startAudioAt(seconds) {
            if (!audioEl) return;
            if (audioEl.readyState >= 1) {
                audioEl.currentTime = seconds;
                return;
            }
            audioEl.src = audioSrcBase + '#t=' + seconds;
            audioEl.addEventListener('loadedmetadata', function once() {
                audioEl.removeEventListener('loadedmetadata', once);
                if (Math.abs(audioEl.currentTime - seconds) > 0.5) audioEl.currentTime = seconds;
            });
        }

        function seekAudio(seconds) {
            if (!audioEl) return;
            rememberPosition(seconds);
            startAudioAt(seconds);
            if (audioEl.paused) audioEl.play();
        }

        // Highlight the active transcript line as audio plays.
        const lineEls = Array.from(document.querySelectorAll('.transcript-line'));
        let activeLine = null;

        if (audioEl && lineEls.length > 0) {
            audioEl.addEventListener('timeupdate', function () {
                // Assigning src -- which arming a #t= fragment does -- resets
                // currentTime to 0 and fires this with no media loaded. That is
                // not playback, and acting on it would drag the highlight back
                // to the first cue of the episode.
                if (audioEl.readyState === 0) return;
                const line = findActiveLine(audioEl.currentTime * 1000);
                if (line !== activeLine) {
                    if (activeLine) activeLine.classList.remove('active');
                    if (line) line.classList.add('active');
                    activeLine = line;
                }
            });
        }

        // Binary search: last line whose data-start-ms <= nowMs.
        function findActiveLine(nowMs) {
            let lo = 0, hi = lineEls.length - 1, result = null;
            while (lo <= hi) {
                const mid = (lo + hi) >>> 1;
                if (+lineEls[mid].dataset.startMs <= nowMs) {
                    result = lineEls[mid];
                    lo = mid + 1;
                } else {
                    hi = mid - 1;
                }
            }
            return result;
        }

        // Match navigation: the lines the search query hit, in transcript order.
        const matchEls = Array.from(document.querySelectorAll('.transcript-line.match'));
        let currentMatch = -1;

        function gotoMatch(index, scroll) {
            if (matchEls.length === 0) return;
            index = ((index % matchEls.length) + matchEls.length) % matchEls.length;
            if (currentMatch >= 0) matchEls[currentMatch].classList.remove('current-match');
            currentMatch = index;
            const el = matchEls[currentMatch];
            el.classList.add('current-match');
            // Centred, so the sticky player never covers the line.
            if (scroll !== false) el.scrollIntoView({block: 'center', behavior: 'smooth'});
            const position = document.getElementById('match-position');
            if (position) position.textContent = String(currentMatch + 1);
        }

        // A shared link names the passage its sender meant, so it outranks the
        // first search match. The navigator is still primed, so n and p work
        // from the first match onward.
        const startAt = timeFromHash();
        if (matchEls.length > 0) gotoMatch(0, startAt === null);
        if (startAt !== null) openAtTime(startAt);

        function timeFromHash() {
            const match = /(?:^|[#&])t=(\d+(?:\.\d+)?)/.exec(location.hash);
            return match ? parseFloat(match[1]) : null;
        }

        // Scroll to the cue and mark it, and arm the player to begin there --
        // without autoplaying, which browsers block and readers do not expect.
        function openAtTime(seconds) {
            // Armed first: the assignment can raise events, and none of them
            // should arrive after the cue below has been marked. preload="none"
            // means nothing is fetched until the reader presses play, and the
            // fragment is what makes that play start here.
            if (audioEl) audioEl.src = audioSrcBase + '#t=' + seconds;
            const line = findActiveLine(seconds * 1000);
            if (line) {
                if (activeLine) activeLine.classList.remove('active');
                line.classList.add('active');
                activeLine = line;
                line.scrollIntoView({block: 'center'});
            }
        }

        // --- Word timings ---------------------------------------------------
        //
        // words.jsonl.gz is roughly 60 KB per episode, so it is never fetched on
        // page load: the first play pulls it, and so does ticking the
        // confidence toggle.

        const wordsUrl = [[${wordsUrl}]];
        const wordControls = document.getElementById('word-controls');
        const transcriptEl = document.getElementById('transcript');
        const dimToggle = document.getElementById('dim-toggle');

        // Whisper's own probability. Below this the decoder was guessing, and
        // the reader deserves to know which words those are.
        const LOW_CONFIDENCE = 0.4;

        let wordsByCue = null;
        let wordSpans = [];      // every rendered word, in time order
        let currentWord = null;
        let wordsRequested = false;

        async function loadWords() {
            if (wordsRequested) return wordsByCue;
            wordsRequested = true;
            if (!wordsUrl) return null;
            let text;
            try {
                const response = await fetch(wordsUrl);
                // 404 is the ordinary case for an episode transcribed before
                // word timings existed. Fall back silently.
                if (!response.ok) return null;
                text = await response.text();
            } catch (e) {
                return null;
            }
            wordsByCue = new Map();
            for (const row of text.split('\n')) {
                if (!row) continue;
                let word;
                try { word = JSON.parse(row); } catch (e) { continue; }
                if (!wordsByCue.has(word.seg)) wordsByCue.set(word.seg, []);
                wordsByCue.get(word.seg).push(word);
            }
            renderWords();
            if (wordControls && wordSpans.length > 0) wordControls.hidden = false;
            return wordsByCue;
        }

        function renderWords() {
            for (const lineEl of lineEls) {
                // A matched line is already marked up with <mark>; rewriting it
                // per word would throw the highlights away. Word timing is the
                // lesser feature here, so it yields.
                if (lineEl.classList.contains('match')) continue;
                const words = wordsByCue.get(+lineEl.dataset.cue);
                if (!words || words.length === 0) continue;
                const textEl = lineEl.querySelector('.transcript-text');
                if (!textEl) continue;

                textEl.textContent = '';
                for (const word of words) {
                    const span = document.createElement('span');
                    // Whisper words carry their own leading space, so
                    // concatenating them reproduces the cue text exactly.
                    span.textContent = word.w;
                    span.className = word.p < LOW_CONFIDENCE ? 'word low-confidence' : 'word';
                    span.dataset.start = word.s;
                    textEl.appendChild(span);
                    wordSpans.push({start: word.s, el: span});
                }
            }
            wordSpans.sort((a, b) => a.start - b.start);
        }

        // Last word whose start is at or before now, by binary search -- the
        // same shape as findActiveLine, over a much longer list.
        function findWordAt(seconds) {
            let lo = 0, hi = wordSpans.length - 1, result = null;
            while (lo <= hi) {
                const mid = (lo + hi) >>> 1;
                if (wordSpans[mid].start <= seconds) {
                    result = wordSpans[mid].el;
                    lo = mid + 1;
                } else {
                    hi = mid - 1;
                }
            }
            return result;
        }

        function highlightWordAt(seconds) {
            if (wordSpans.length === 0) return;
            const word = findWordAt(seconds);
            if (word === currentWord) return;
            if (currentWord) currentWord.classList.remove('current-word');
            if (word) word.classList.add('current-word');
            currentWord = word;
        }

        if (audioEl) {
            audioEl.addEventListener('play', loadWords, {once: true});
            audioEl.addEventListener('timeupdate', function () {
                if (audioEl.readyState === 0) return;
                highlightWordAt(audioEl.currentTime);
            });
        }

        if (dimToggle) {
            dimToggle.addEventListener('change', async function () {
                await loadWords();
                transcriptEl.classList.toggle('dim-low-confidence', dimToggle.checked);
            });
        }

        // The toggle is the only way in for a reader who never presses play, so
        // it has to be reachable before the words are fetched.
        if (wordsUrl && wordControls) wordControls.hidden = false;

        document.addEventListener('keydown', function (e) {
            const tag = document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
            // Ctrl+P is print and Alt+Left is back; the browser keeps those.
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            if (e.key === 'n' && matchEls.length > 0) {
                e.preventDefault();
                gotoMatch(currentMatch + 1);
                return;
            } else if (e.key === 'p' && matchEls.length > 0) {
                e.preventDefault();
                gotoMatch(currentMatch - 1);
                return;
            }
            if (!audioEl) return;
            if (e.key === ' ') {
                e.preventDefault();
                audioEl.paused ? audioEl.play() : audioEl.pause();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                audioEl.currentTime = Math.max(0, audioEl.currentTime - 15);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                audioEl.currentTime = Math.min(audioEl.duration || Infinity, audioEl.currentTime + 15);
            }
        });
        /*]]>*/
    </script>

</div><!-- end episode-detail -->

</body>
</html>
