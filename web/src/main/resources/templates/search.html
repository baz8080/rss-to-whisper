<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Podcast Search</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css"/>
    <link rel="stylesheet" href="/styles.css"/>
    <script src="/htmx.min.js"></script>
    <script>
        let filterSheetWasOpen = false;
        document.addEventListener("htmx:beforeSwap", function (e) {
            if (e.detail.target.id === "app") {
                const el = document.getElementById("filter-container");
                filterSheetWasOpen = el ? el.classList.contains("open") : false;
            }
        });
        document.addEventListener("htmx:afterSwap", function (e) {
            if (e.detail.target.id === "app") {
                window.scrollTo(0, 0);
                if (filterSheetWasOpen) openFilterSheet();
            }
        });
        function openFilterSheet() {
            document.getElementById("filter-container").classList.add("open");
            document.getElementById("filter-backdrop").classList.add("open");
        }
        function closeFilterSheet() {
            document.getElementById("filter-container").classList.remove("open");
            document.getElementById("filter-backdrop").classList.remove("open");
        }
    </script>
</head>
<body>

<!--
  th:fragment="app" marks this div as the HTMX swap target.
  Full requests render the whole page; HTMX partial requests render only this
  fragment via templateEngine.process("search :: app", ctx).
-->
<div id="app" th:fragment="app"
     th:with="activeFilterCount=${filters.durations.size() + filters.podcasts.size() + filters.collections.size() + filters.tags.size() + filters.episodeTypes.size()}">

    <div id="filter-backdrop" class="filter-backdrop" onclick="closeFilterSheet()"></div>

    <div class="app-layout">

        <!-- Filter container: sidebar on desktop, bottom sheet on mobile -->
        <div class="filter-container" id="filter-container">
            <div class="filter-sheet-header">
                <span th:text="${activeFilterCount > 0 ? 'Filters · ' + activeFilterCount : 'Filters'}">Filters</span>
                <a th:if="${activeFilterCount > 0}"
                   class="clear-filters-link"
                   th:href="${clearUrl}"
                   th:attr="hx-get=${clearUrl}"
                   hx-target="#app"
                   hx-swap="outerHTML"
                   hx-push-url="true"
                   onclick="closeFilterSheet()">Clear all</a>
                <button type="button" class="filter-sheet-close" onclick="closeFilterSheet()">&#x2715;</button>
            </div>
            <nav class="sidebar">
            <div class="sidebar-filter-header" th:if="${activeFilterCount > 0}">
                <a class="clear-filters-link"
                   th:href="${clearUrl}"
                   th:attr="hx-get=${clearUrl}"
                   hx-target="#app"
                   hx-swap="outerHTML"
                   hx-push-url="true">Clear all</a>
            </div>
            <form id="filter-form"
                  action="/search"
                  method="get"
                  hx-get="/search"
                  hx-target="#app"
                  hx-swap="outerHTML"
                  hx-push-url="true"
                  hx-trigger="change from:input[type='checkbox']"
                  hx-include="#search-input"
                  hx-indicator="#loading">

                <!--/* The active tags are links in the sidebar, and a form does not
                       serialise links. Without these, ticking any checkbox re-submits
                       without tag= and silently drops the tag filter. */-->
                <input type="hidden" name="tag"
                       th:each="tag : ${filters.tags}"
                       th:value="${tag}"/>

                <details class="filter-group" open="open">
                    <summary>Duration</summary>
                    <div class="filter-list">
                        <label>
                            <input type="checkbox" name="duration" value="short"
                                   th:checked="${filters.durations.contains('short')}"/>
                            <small>Short (&lt; 15 min)</small>
                        </label>
                        <label>
                            <input type="checkbox" name="duration" value="medium"
                                   th:checked="${filters.durations.contains('medium')}"/>
                            <small>Medium (15&#x2013;45 min)</small>
                        </label>
                        <label>
                            <input type="checkbox" name="duration" value="long"
                                   th:checked="${filters.durations.contains('long')}"/>
                            <small>Long (&gt; 45 min)</small>
                        </label>
                    </div>
                </details>

                <details class="filter-group" open="open"
                         th:if="${filterOptions.podcasts.size() > 1}">
                    <summary>Podcast</summary>
                    <div class="filter-list">
                        <label th:each="podcast : ${filterOptions.podcasts}">
                            <input type="checkbox" name="podcast"
                                   th:value="${podcast}"
                                   th:checked="${filters.podcasts.contains(podcast)}"/>
                            <small th:text="${podcast}"></small>
                        </label>
                    </div>
                </details>

                <details class="filter-group"
                         th:if="${not filterOptions.collections.isEmpty()}">
                    <summary>Collections</summary>
                    <div class="filter-list">
                        <label th:each="collection : ${filterOptions.collections}">
                            <input type="checkbox" name="collection"
                                   th:value="${collection}"
                                   th:checked="${filters.collections.contains(collection)}"/>
                            <small th:text="${collection}"></small>
                        </label>
                    </div>
                </details>

                <!--/* Only the ACTIVE tags: feeds contribute thousands of keywords,
                       so the sidebar would be unusable listing them all. Tag pills
                       on the result cards are how a tag gets added. */-->
                <details class="filter-group" open="open"
                         th:if="${not filters.tags.isEmpty()}">
                    <summary>Tags</summary>
                    <div class="filter-list">
                        <a class="tag-pill tag-pill-active"
                           th:each="tag : ${filters.tags}"
                           th:href="${tagRemoveUrls.get(tag)}"
                           th:attr="hx-get=${tagRemoveUrls.get(tag)}"
                           hx-target="#app"
                           hx-swap="outerHTML"
                           hx-push-url="true"
                           th:title="'Remove the ' + ${tag} + ' filter'"
                           th:text="${tag} + ' ✕'"></a>
                    </div>
                </details>

                <details class="filter-group"
                         th:if="${filterOptions.episodeTypes.size() > 1}">
                    <summary>Episode Type</summary>
                    <div class="filter-list">
                        <label th:each="type : ${filterOptions.episodeTypes}">
                            <input type="checkbox" name="episodeType"
                                   th:value="${type}"
                                   th:checked="${filters.episodeTypes.contains(type)}"/>
                            <small th:text="${type}"></small>
                        </label>
                    </div>
                </details>

            </form>
            </nav>
        </div><!-- end filter-container -->

        <!-- Main content -->
        <div class="main-content">

            <div class="search-bar">
                <button type="button" class="filter-toggle-btn" onclick="openFilterSheet()"
                        th:text="${activeFilterCount > 0 ? 'Filters · ' + activeFilterCount : 'Filters'}">Filters</button>
                <input id="search-input"
                       type="search"
                       name="q"
                       placeholder="Search episodes&#x2026;"
                       th:value="${filters.query}"
                       hx-get="/search"
                       hx-target="#app"
                       hx-swap="outerHTML"
                       hx-push-url="true"
                       hx-trigger="input changed delay:500ms, search"
                       hx-include="#filter-form"
                       hx-indicator="#loading"/>
            </div>

            <span class="htmx-indicator" id="loading" aria-busy="true">Searching&#x2026;</span>

            <!-- Results summary -->
            <p class="results-info" th:if="${result.totalCount > 0}">
                <span th:text="${result.totalCount}"></span> results
                <th:block th:if="${not #strings.isEmpty(filters.query)}">
                    for &#x201C;<span th:text="${filters.query}"></span>&#x201D;
                </th:block>
                &#xB7; Page <span th:text="${result.page}"></span>
                of <span th:text="${result.totalPages}"></span>
            </p>

            <p th:if="${result.episodes.isEmpty() and hasActiveFilters}">
                No episodes found. Try adjusting your search or filters.
            </p>
            <p th:if="${result.episodes.isEmpty() and not hasActiveFilters}">
                Search for episodes using the search bar above.
            </p>

            <!-- Episode cards -->
            <article class="episode-card" th:each="episode : ${result.episodes}">
                <div class="podcast-name"
                     th:text="${episode.podcastTitle != null ? episode.podcastTitle : 'Unknown Podcast'}"></div>
                <h3>
                    <a th:href="'/episode/' + ${episode.id} + ${episodeQuerySuffix}"
                       th:text="${episode.episodeTitle != null ? episode.episodeTitle : 'Untitled'}"></a>
                </h3>
                <div class="meta">
                    <span th:if="${episode.episodePublishedOn != null}"
                          th:text="${episode.episodePublishedOn}"></span>
                    <span th:if="${episode.formattedDuration != null}"
                          th:text="${episode.formattedDuration}"></span>
                    <span th:if="${episode.episodeSeason != null and episode.episodeNumber != null}"
                          th:text="'S' + ${episode.episodeSeason} + 'E' + ${episode.episodeNumber}"></span>
                    <span class="tag-pill"
                          th:if="${episode.episodeType != null and episode.episodeType != 'full'}"
                          th:text="${episode.episodeType}"></span>
                </div>

                <!-- Snippet: th:utext is safe here because snippetHtml is HTML-escaped
                     and only re-introduces the <mark> tags. -->
                <div class="snippet"
                     th:if="${episode.snippetHtml != null}"
                     th:utext="${episode.snippetHtml}"></div>

                <!-- Tags -->
                <div th:if="${not episode.tagList.isEmpty()}">
                    <a class="tag-pill"
                       th:each="tag : ${episode.tagList}"
                       th:href="${tagBaseUrl} + 'tag=' + ${#uris.escapeQueryParam(tag)}"
                       th:attr="hx-get=${tagBaseUrl} + 'tag=' + ${#uris.escapeQueryParam(tag)}"
                       hx-target="#app"
                       hx-swap="outerHTML"
                       hx-push-url="true"
                       th:text="${tag}"></a>
                </div>

                <!-- Audio player -->
                <div class="audio-player" th:if="${episode.audioPath != null}">
                    <audio controls="controls" preload="none"
                           th:src="${audioBaseUrl + '/' + episode.audioPath}">
                        Your browser does not support audio.
                    </audio>
                </div>
            </article><!-- end episode-card loop -->

            <!-- Pagination -->
            <div class="pagination" th:if="${result.totalPages > 1}">
                <button th:if="${result.hasPrevious}"
                        th:attr="hx-get=${prevUrl}"
                        hx-target="#app"
                        hx-swap="outerHTML"
                        hx-push-url="true">Previous</button>
                <span>Page <span th:text="${result.page}"></span>
                    of <span th:text="${result.totalPages}"></span></span>
                <button th:if="${result.hasNext}"
                        th:attr="hx-get=${nextUrl}"
                        hx-target="#app"
                        hx-swap="outerHTML"
                        hx-push-url="true">Next</button>
            </div>

        </div><!-- end main-content -->
    </div><!-- end app-layout -->
</div><!-- end #app -->

</body>
</html>
